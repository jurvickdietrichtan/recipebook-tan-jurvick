{% extends "ledger/base.html" %}

{% block page_title %}
Upload Image
{% endblock %}

{% block content %}
<a href="{% url 'recipe_detail' pk=recipe_pk %}">Back to Recipe</a>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Upload</button>
</form>

{% endblock %}
